<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>मेरो प्रेम कथा ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, "Noto Sans Devanagari", sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 30px 24px;
      background: white;
      border-radius: 25px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.20);
      text-align: center;
    }

    .heart {
      font-size: 58px;
      animation: heartbeat 1.2s infinite;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }
    }

    h1 {
      margin: 12px 0 8px;
      color: #ff477e;
      font-size: 29px;
    }

    .subtitle {
      margin-bottom: 25px;
      color: #555;
      font-size: 16px;
      line-height: 1.6;
    }

    .label {
      display: block;
      text-align: left;
      margin-top: 15px;
      margin-bottom: 7px;
      color: #444;
      font-weight: bold;
      font-size: 15px;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border: 2px solid #ffd1dc;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
      font-family: Arial, "Noto Sans Devanagari", sans-serif;
    }

    input:focus,
    textarea:focus {
      border-color: #ff477e;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 13px;
      background: #ff477e;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    #result {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: #fff0f4;
      border-radius: 17px;
      color: #ff477e;
      font-size: 19px;
      font-weight: bold;
      line-height: 1.7;
    }

    .prediction-title {
      font-size: 15px;
      color: #777;
      margin-bottom: 8px;
    }

    .small {
      margin-top: 18px;
      color: #999;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="heart">❤️</div>

    <h1>मेरो प्रेम कथा</h1>

    <div class="subtitle">
      आफ्नो मनको कुरा लेख्नुहोस्... 💌<br>
      अनि आफ्नो प्रेमको भविष्य हेर्नुहोस्! 🔮
    </div>

    <label class="label" for="crushName">
      ❤️ तपाईंको Crush को नाम
    </label>

    <input
      id="crushName"
      type="text"
      placeholder="Enter name..."
      maxlength="50"
      autocomplete="off"
    >

    <label class="label" for="message">
      💌 उहाँका लागि Message
    </label>

    <textarea
      id="message"
      placeholder="Write your message..."
      maxlength="500"
    ></textarea>

    <label class="label" for="wish">
      ✨ तपाईंको Wish
    </label>

    <textarea
      id="wish"
      placeholder="Write your wish..."
      maxlength="300"
    ></textarea>

    <button onclick="showPrediction()">
      ❤️ मेरो प्रेमको भविष्य हेर्नुहोस्
    </button>

    <div id="result"></div>

    <div class="small">
      🔮 आफ्नो भाग्य जाँच गर्नुहोस् 😍
    </div>

  </div>

  <script>

    function showPrediction() {

      const crushName =
        document.getElementById("crushName").value.trim();

      const message =
        document.getElementById("message").value.trim();

      const wish =
        document.getElementById("wish").value.trim();

      const result =
        document.getElementById("result");

      if (crushName === "") {
        result.style.display = "block";
        result.innerHTML =
          "😂 पहिले आफ्नो Crush को नाम त लेख्नुहोस्!";
        return;
      }

      if (message === "") {
        result.style.display = "block";
        result.innerHTML =
          "💌 आफ्नो Crush का लागि एउटा Message लेख्नुहोस्!";
        return;
      }

      if (wish === "") {
        result.style.display = "block";
        result.innerHTML =
          "✨ आफ्नो एउटा Wish पनि लेख्नुहोस्!";
        return;
      }

      const predictions = [

        "❤️ तपाईंले आफ्नो Crush लाई पाउनुहुनेछ! तपाईंहरूको प्रेम सधैंभरि रहनेछ।",

        "💍 तपाईंहरूको प्रेम कथा विवाहसम्म पुग्ने संकेत देखिन्छ! 😍",

        "💕 तपाईंको Crush ले पनि तपाईंलाई मन पराउने सम्भावना धेरै छ!",

        "❤️ तपाईंहरू एकअर्काको जीवनमा धेरै लामो समयसम्म रहनुहुनेछ!",

        "😍 तपाईंको Love Story सुरु हुन लागेको छ... अब ढिला नगर्नुहोस्!",

        "💖 तपाईंको Wish पूरा हुने संकेत देखिन्छ! तपाईंको प्रेम सफल हुनेछ।",

        "😂 भाग्यले त तपाईंलाई Crush सँगै पठाइसकेको छ... अब कुरा तपाईंको हातमा छ!",

        "🥰 तपाईं र तपाईंको Crush को सम्बन्ध अझै गहिरो हुने संकेत छ!",

        "💘 तपाईंको प्रेम कथामा Happy Ending लेखिएको देखिन्छ!",

        "✨ तपाईंको मनको मान्छे तपाईंको जीवनमा विशेष ठाउँ बनाउनेछ!"
      ];

      const randomNumber =
        Math.floor(Math.random() * predictions.length);

      const prediction =
        predictions[randomNumber];

      result.style.display = "block";

      result.innerHTML =
        '<div class="prediction-title">🔮 तपाईंको प्रेमको भविष्यवाणी</div>' +
        prediction +
        "<br><br>" +
        "❤️ " + escapeHTML(crushName) +
        " ❤️";

    }


    function escapeHTML(text) {

      const element =
        document.createElement("div");

      element.textContent = text;

      return element.innerHTML;
    }

  </script>

</body>
      </html>
