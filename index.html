<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>मेरो प्रेम कथा ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, "Noto Sans Devanagari", sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 28px 22px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.20);
    }

    .heart {
      text-align: center;
      font-size: 52px;
      animation: beat 1.2s infinite;
    }

    @keyframes beat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.12);
      }
    }

    h1 {
      margin: 10px 0 8px;
      text-align: center;
      color: #ff477e;
      font-size: 28px;
    }

    .subtitle {
      margin-bottom: 22px;
      text-align: center;
      color: #666;
      font-size: 15px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      color: #444;
      font-size: 15px;
      font-weight: bold;
    }

    input,
    textarea {
      display: block;
      width: 100%;
      max-width: 100%;
      padding: 13px;
      border: 2px solid #ffd1dc;
      border-radius: 12px;
      outline: none;
      background: #fff;
      color: #333;
      font-size: 16px;
      font-family: Arial, "Noto Sans Devanagari", sans-serif;
    }

    input:focus,
    textarea:focus {
      border-color: #ff477e;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #ff477e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 15px;
      background: #fff0f4;
      color: #ff477e;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.6;
    }

    .prediction-title {
      margin-bottom: 8px;
      color: #777;
      font-size: 13px;
    }

    .footer {
      margin-top: 16px;
      text-align: center;
      color: #999;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="heart">❤️</div>

    <h1>मेरो प्रेम कथा</h1>

    <div class="subtitle">
      आफ्नो मनको कुरा लेख्नुहोस् 💌<br>
      अनि आफ्नो प्रेमको भविष्य हेर्नुहोस् 🔮
    </div>

    <form
      id="loveForm"
      action="https://formspree.io/f/mjykyvdo"
      method="POST"
    >

      <label for="crushName">
        ❤️ तपाईंको Crush को नाम
      </label>

      <input
        id="crushName"
        name="Crush Name"
        type="text"
        placeholder="Enter name..."
        maxlength="50"
        required
      >

      <label for="message">
        💌 उहाँका लागि Message
      </label>

      <textarea
        id="message"
        name="Message"
        placeholder="Write your message..."
        maxlength="500"
        required
      ></textarea>

      <label for="wish">
        ✨ तपाईंको Wish
      </label>

      <textarea
        id="wish"
        name="Wish"
        placeholder="Write your wish..."
        maxlength="300"
        required
      ></textarea>

      <input
        type="hidden"
        id="submissionTime"
        name="Submission Time"
      >

      <button type="submit">
        ❤️ मेरो प्रेमको भविष्य हेर्नुहोस्
      </button>

    </form>

    <div id="result"></div>

    <div class="footer">
      🔮 भाग्यले के भन्छ हेरौँ 😍
    </div>

  </div>

  <script>
    const form = document.getElementById("loveForm");
    const result = document.getElementById("result");

    const predictions = [
      "❤️ तपाईंले आफ्नो Crush लाई पाउनुहुनेछ! तपाईंहरूको प्रेम सधैंभरि रहनेछ।",

      "💍 तपाईंहरूको प्रेम कथा विवाहसम्म पुग्ने संकेत देखिन्छ! 😍",

      "💕 तपाईंको Crush ले पनि तपाईंलाई मन पराउने संकेत देखिन्छ!",

      "❤️ तपाईंहरू एकअर्काको जीवनमा धेरै लामो समयसम्म रहनुहुनेछ!",

      "😍 तपाईंको Love Story सुरु हुन लागेको छ... अब ढिला नगर्नुहोस्!",

      "💖 तपाईंको Wish पूरा हुने संकेत देखिन्छ!",

      "😂 भाग्यले त तपाईंलाई Crush सँगै पठाइसकेको छ... अब कुरा तपाईंको हातमा छ!",

      "🥰 तपाईं र तपाईंको Crush को सम्बन्ध अझै गहिरो हुने संकेत छ!",

      "💘 तपाईंको प्रेम कथामा Happy Ending लेखिएको देखिन्छ!",

      "✨ तपाईंको मनको मान्छे तपाईंको जीवनमा विशेष ठाउँ बनाउनेछ!"
    ];

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const crushName =
        document.getElementById("crushName").value.trim();

      const message =
        document.getElementById("message").value.trim();

      const wish =
        document.getElementById("wish").value.trim();

      if (!crushName || !message || !wish) {
        result.style.display = "block";
        result.innerHTML =
          "😂 सबै कुरा पूरा गरेर मात्र अगाडि बढ्नुहोस्!";
        return;
      }

      const now = new Date();

      document.getElementById("submissionTime").value =
        now.toLocaleString();

      const formData = new FormData(form);

      try {

        await fetch(form.action, {
          method: "POST",
          body: formData,
          headers: {
            "Accept": "application/json"
          }
        });

        const randomNumber =
          Math.floor(Math.random() * predictions.length);

        const prediction =
          predictions[randomNumber];

        result.style.display = "block";

        result.innerHTML =
          '<div class="prediction-title">' +
          '🔮 तपाईंको प्रेमको भविष्यवाणी' +
          '</div>' +
          prediction +
          '<br><br>' +
          '❤️ ' +
          escapeHTML(crushName) +
          ' ❤️';

        result.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });

      } catch (error) {

        result.style.display = "block";

        result.innerHTML =
          "😅 केही समस्या भयो। फेरि प्रयास गर्नुहोस्!";
      }

    });

    function escapeHTML(text) {

      const element =
        document.createElement("div");

      element.textContent = text;

      return element.innerHTML;
    }
  </script>

</body>
</html>
